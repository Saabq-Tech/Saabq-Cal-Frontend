<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        try {
          var lang = localStorage.getItem('saabq_lang') || 'ar';
          var dir = lang === 'ar' ? 'rtl' : 'ltr';
          document.documentElement.setAttribute('lang', lang);
          document.documentElement.setAttribute('dir', dir);

          var theme = localStorage.getItem('saabq_theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = theme === 'dark' || (!theme && prefersDark);
          if (isDark) {
            document.documentElement.classList.add('dark');
          }

          var path = (window.location.pathname || '').toLowerCase();
          var isWorkspace = path === '/member' || path.indexOf('/member/') === 0 || path.indexOf('/workspaces/') === 0;

          var p = null;
          var s = null;
          if (isWorkspace) {
            p = localStorage.getItem('saabq_primary_color');
            s = localStorage.getItem('saabq_secondary_color');
            if (!p && !s) {
              var storedUser = localStorage.getItem('saabq_user');
              if (storedUser) {
                var parsed = JSON.parse(storedUser);
                if (parsed && parsed.workspace) {
                  p = parsed.workspace.primary_color || null;
                  s = parsed.workspace.secondary_color || null;
                }
              }
            }
          }

          var root = document.documentElement;
          if (p && /^#[0-9A-Fa-f]{3,8}$/.test(p)) {
            root.style.setProperty('--primary', p);
            root.style.setProperty('--primary-color', p);
            root.style.setProperty('--primary-light', p);
            root.style.setProperty('--sb-accent', p);
          }
          if (s && /^#[0-9A-Fa-f]{3,8}$/.test(s)) {
            root.style.setProperty('--secondary', s);
            root.style.setProperty('--secondary-color', s);
            root.style.setProperty('--accent', s);
          }

          var targetThemeColor = isWorkspace
            ? (p || s || (isDark ? '#022a35' : '#026982'))
            : (isDark ? '#022a35' : '#026982');

          var metaTheme = document.querySelector('meta[name="theme-color"]');
          if (!metaTheme) {
            metaTheme = document.createElement('meta');
            metaTheme.setAttribute('name', 'theme-color');
            document.head.appendChild(metaTheme);
          }
          metaTheme.setAttribute('content', targetThemeColor);
        } catch (e) {}
      })();
    </script>
    <link rel="icon" id="app-favicon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Saabq Cal — Smart scheduling and appointment management platform. Book, manage, and automate your workspace appointments." />
    <meta name="theme-color" content="#026982" />

    <!-- Preconnect hints for faster resource loading -->
    <link rel="preconnect" href="https://admin.cal.saabq.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800&display=swap" />

    <!-- Default Open Graph meta (overridden per-route by react-helmet-async) -->
    <meta property="og:title" content="سابق كول — الجدولة وإدارة المواعيد الذكية" />
    <meta property="og:description" content="Saabq Cal — Smart scheduling and appointment management platform." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Saabq Cal" />
    <meta property="og:image" content="https://cal.saabq.com/logo.png" />
    <meta property="og:url" content="https://cal.saabq.com/" />

    <!-- Default Twitter Card meta -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="سابق كول — الجدولة وإدارة المواعيد الذكية" />
    <meta name="twitter:description" content="Saabq Cal — Smart scheduling and appointment management platform." />
    <meta name="twitter:image" content="https://cal.saabq.com/logo.png" />

    <title>سابق كول — الجدولة وإدارة المواعيد الذكية</title>
  </head>
  <body>
    <div id="root">
      <!-- SSR/Crawler fallback: visible only before JS hydrates -->
      <noscript>
        <div style="text-align:center;padding:60px 20px;font-family:system-ui,sans-serif">
          <h1>Saabq Cal — سابق كول</h1>
          <p>Smart scheduling and appointment management platform.</p>
          <p>منصة ذكية لجدولة وإدارة المواعيد.</p>
          <p>Please enable JavaScript to use this application.</p>
        </div>
      </noscript>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
