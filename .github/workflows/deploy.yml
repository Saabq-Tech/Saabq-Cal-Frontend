name: Frontend CI/CD & Production Deployment

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production-website
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  code-quality-and-build:
    name: Code Quality & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Validate Translation Keys (lang:check)
        id: check-lang
        continue-on-error: true
        run: npm run lang:check

      - name: Validate Code Formatting & Linting
        id: check-lint
        continue-on-error: true
        run: npm run lint

      - name: Build Application Artifacts
        id: check-build
        continue-on-error: true
        run: npm run build

      - name: Summarize & Notify on Failure
        if: ${{ always() && (steps.check-lang.outcome == 'failure' || steps.check-lint.outcome == 'failure' || steps.check-build.outcome == 'failure') }}
        run: |
          echo "::error title=CI Verification Alert::One or more website CI checks failed for @${{ github.actor }}."
          echo "### ⚠️ CI Verification Failure Summary" >> $GITHUB_STEP_SUMMARY
          echo "Attention **Committer** (@${{ github.actor }}) and **Repo Owner** (@${{ github.repository_owner }}):" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Verification Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Translation Keys** | ${{ steps.check-lang.outcome == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Linting & Code Style** | ${{ steps.check-lint.outcome == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Production Build** | ${{ steps.check-build.outcome == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          exit 1

  deploy:
    name: Deploy Frontend to Production
    needs: code-quality-and-build
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          test -n "$SSH_PRIVATE_KEY" || {
            echo "::error::SSH_PRIVATE_KEY secret is not set"
            exit 1
          }

          test -n "$SSH_HOST" || {
            echo "::error::SSH_HOST secret is not set"
            exit 1
          }

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan \
            -p "${SSH_PORT:-22}" \
            -H "$SSH_HOST" \
            >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to VPS
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
        run: |
          test -n "$SSH_USER" || {
            echo "::error::SSH_USER secret is not set"
            exit 1
          }

          test -n "$VPS_PATH" || {
            echo "::error::VPS_PATH secret is not set"
            exit 1
          }

          ssh \
            -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            -p "${SSH_PORT:-22}" \
            "$SSH_USER@$SSH_HOST" \
            'bash -seuo pipefail' <<REMOTE

          echo "→ Target deployment path: $VPS_PATH"
          mkdir -p "$VPS_PATH"
          cd "$VPS_PATH"

          if [ ! -d ".git" ]; then
            echo "→ Initializing git repository..."
            git init
          fi

          if ! git remote get-url origin >/dev/null 2>&1; then
            echo "→ Setting remote origin..."
            git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          else
            git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          fi

          echo "→ Current commit:"
          git rev-parse HEAD 2>/dev/null || echo "No previous commit (initial deployment)"

          echo "→ Fetching latest main..."
          git fetch --prune origin main
          git reset --hard origin/main
          git clean -fd

          echo "→ Installing Frontend dependencies..."
          npm ci

          echo "→ Configuring environment variables..."
          cp .env.example .env
          sed -i 's|VITE_BASE_PATH=.*|VITE_BASE_PATH=/|g' .env

          echo "→ Building Frontend assets..."
          npm run build

          echo "→ Cleaning web root directory and publishing production build..."
          TMP_BUILD_DIR=\$(mktemp -d)
          cp -r dist/* "\$TMP_BUILD_DIR/"

          rm -rf "$VPS_PATH"/*

          cp -r "\$TMP_BUILD_DIR"/* "$VPS_PATH"/
          rm -rf "\$TMP_BUILD_DIR"

          echo "✓ Deployment complete"

          REMOTE

      - name: Ensure nginx SPA routing (try_files)
        continue-on-error: true
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            -p "${SSH_PORT:-22}" \
            "$SSH_USER@$SSH_HOST" \
            'bash -seuo pipefail' <<'NGINX_FIX'

          CONF=$(grep -rl "experts.saabq.com" /etc/nginx/ 2>/dev/null | head -1)

          if [ -z "$CONF" ]; then
            echo "⚠ Could not find nginx config for experts.saabq.com — skipping"
            exit 0
          fi

          if grep -q "try_files.*index\.html" "$CONF"; then
            echo "✓ SPA try_files already configured in $CONF"
            exit 0
          fi

          echo "→ Adding try_files to $CONF..."
          sed -i '/location \/ {/a\        try_files $uri $uri/ /index.html;' "$CONF"

          echo "→ Testing nginx config..."
          nginx -t

          echo "→ Reloading nginx..."
          systemctl reload nginx

          echo "✓ nginx SPA routing configured"

          NGINX_FIX
